on:
  workflow_call:

jobs:
  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # The Dockerfile keeps the toolchain, the registry and the build dir in
      # `RUN --mount=type=cache` mounts. Those live in the builder, which is fresh on
      # every runner, so their contents are saved and restored around the build.
      # A cache entry is immutable, so every run saves a new one; the restore takes
      # the newest entry with the closest match, as the lockfile and the toolchain
      # decide most of what is in there. Merge queue runs only restore: an entry
      # saved on a merge queue ref is not visible to any other ref, so it would
      # never be hit.
      - name: Cache the build cache mounts
        uses: actions/cache@v6
        with:
          path: cache-mount
          key: docker-cache-mounts-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            docker-cache-mounts-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            docker-cache-mounts-
        if: ${{ github.event_name != 'merge_group' }}

      - name: Restore the build cache mounts
        uses: actions/cache/restore@v6
        with:
          path: cache-mount
          key: docker-cache-mounts-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            docker-cache-mounts-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            docker-cache-mounts-
        if: ${{ github.event_name == 'merge_group' }}

      # Injects the restored contents into the builder's cache mounts, and extracts
      # them back into `cache-mount` in its post step, before the cache is saved.
      # The extraction is skipped when nothing saves the result.
      - name: Inject the cache mounts into the builder
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ github.event_name == 'merge_group' }}

      - name: Docker meta for main
        id: meta-main
        uses: docker/metadata-action@v6
        with:
          bake-target: docker-metadata-action-main
          images: |
            ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=${{ github.repository }}-main
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          source: .
          allow: ssh
          files: |
            ./docker-bake.hcl
            ${{ steps.meta-main.outputs.bake-file }}
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
