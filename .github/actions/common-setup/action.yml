name: "Common setup"
description: "Apply the common setup steps for this codebase"
inputs:
  platformCacheKey:
    description: "The key for the cache for the platform; if empty the caching will be disabled"
    required: false
    default: ""
  modeCacheKey:
    description: "The key for the cache for the mode"
    required: false
    default: ""
  requiresRust:
    description: "Requires rust to be installed"
    required: false
    default: "true"
  buildEnvScript:
    description: "The script to run to bootstrap the given environment"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.modeCacheKey == '' && inputs.platformCacheKey || ''}}
        shared-key: ${{ inputs.modeCacheKey != '' && format('{0}-{1}', inputs.platformCacheKey, inputs.modeCacheKey) || '' }}
      if: ${{ inputs.platformCacheKey != '' && inputs.requiresRust == 'true' }}

    - name: Install rust toolchain
      shell: bash
      run: rustup show
      if: ${{ inputs.requiresRust == 'true' }}

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.19.0"
      if: ${{ inputs.requiresRust == 'true' }}

    # `rust-cache` restores the dependencies but leaves the workspace crates out, as
    # they change on every push. Those go through `sccache`, which stores the result
    # of each `rustc` invocation by content in the Actions cache; the workspace
    # wrapper keeps it off the dependencies, so nothing is cached twice. `cargo
    # clippy` replaces the workspace wrapper with its own, so the clippy job runs
    # without `sccache`. Incremental compilation is off, as `sccache` cannot cache
    # incremental builds.
    - name: Enable sccache
      shell: bash
      run: |
        printf "RUSTC_WORKSPACE_WRAPPER=%s\n" "sccache" >>"$GITHUB_ENV"
        printf "SCCACHE_GHA_ENABLED=%s\n" "on" >>"$GITHUB_ENV"
        printf "CARGO_INCREMENTAL=%s\n" "0" >>"$GITHUB_ENV"
      if: ${{ inputs.requiresRust == 'true' }}

    - name: Prepare the build environment
      uses: ./.github/actions/env
      with:
        script: ${{ inputs.buildEnvScript }}
      if: ${{ inputs.buildEnvScript != 'skip' }}

    - name: Print build environment info
      shell: bash
      run: |
        set -x
        cargo --version
        cargo clippy --version
        env
